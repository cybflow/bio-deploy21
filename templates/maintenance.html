<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.site_name|default:"AEiViON" }} — Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--orange:{{ site.accent_color|default:"#ff4d00" }}}
  body{font-family:'DM Sans',sans-serif;background:#050505;color:#f0f0f0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,77,0,.07),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(37,99,235,.06),transparent 60%);pointer-events:none;}
  .card{max-width:440px;width:100%;text-align:center;padding:48px 36px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;backdrop-filter:blur(12px);}
  .icon{width:64px;height:64px;border-radius:50%;background:rgba(255,77,0,.12);border:1px solid rgba(255,77,0,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
  .icon svg{width:28px;height:28px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .brand{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:16px;}
  h1{font-size:clamp(22px,5vw,28px);font-weight:700;letter-spacing:-.4px;margin-bottom:12px;}
  p{font-size:14px;line-height:1.7;color:rgba(240,240,240,.6);max-width:320px;margin:0 auto;}
  .dot-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:32px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.4s ease-in-out infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </div>
  <p class="brand">{{ site.site_name|default:"AEiViON" }}</p>
  <h1>Down for Maintenance</h1>
  <p>{{ site.maintenance_msg|default:"We are performing scheduled maintenance. We'll be back shortly." }}</p>
  <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body>
</html>
