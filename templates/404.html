<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost Panda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bamboo: #ff4d00;
    --bamboo-dark: #c03d05;
    --panda-white: #f0f4f8;
    --panda-black: #1a1a2e;
    --accent: #fb923c;
    --accent2: #f472b6;
    --mist: rgba(255,255,255,0.04);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--panda-white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Ambient background ── */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-glow::before {
    content: '';
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(74,222,128,0.10) 0%, transparent 70%);
    top: -200px; left: -150px;
    animation: driftA 12s ease-in-out infinite alternate;
  }
  .bg-glow::after {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,114,182,0.09) 0%, transparent 70%);
    bottom: -150px; right: -100px;
    animation: driftB 15s ease-in-out infinite alternate;
  }
  @keyframes driftA { to { transform: translate(80px, 60px); } }
  @keyframes driftB { to { transform: translate(-60px, -80px); } }

  /* Floating particles */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    animation: floatParticle linear infinite;
    opacity: 0;
  }
  @keyframes floatParticle {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Ground mist */
  .mist {
    position: fixed;
    bottom: 0; left: -10%;
    width: 120%; height: 180px;
    background: linear-gradient(to top, rgba(74,222,128,0.06) 0%, transparent 100%);
    animation: mistShift 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes mistShift { to { transform: translateX(4%); } }

  /* ── Layout ── */
  .scene {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Error number (3D extruded) ── */
  .error-number {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(100px, 20vw, 180px);
    line-height: 1;
    color: var(--panda-white);
    letter-spacing: -4px;
    position: relative;
    /* 3D layered text-shadow extrusion */
    text-shadow:
      1px  1px 0 #c9d5e0,
      2px  2px 0 #b3c2cf,
      3px  3px 0 #9eb0bf,
      4px  4px 0 #889dae,
      5px  5px 0 #738a9d,
      6px  6px 0 #5e778c,
      7px  7px 0 #4a647b,
      8px  8px 0 #36526a,
      9px  9px 0 #224059,
      10px 10px 0 #0e2e48,
      11px 11px 8px rgba(0,0,0,0.6);
    animation: numberFloat 4s ease-in-out infinite;
    transform-origin: center;
    user-select: none;
  }

  .error-number .zero {
    display: inline-block;
    animation: zeroSpin 6s ease-in-out infinite;
    transform-origin: center;
    color: var(--bamboo);
    text-shadow:
      1px  1px 0 #ff4d00,
      2px  2px 0 #16a34a,
      3px  3px 0 #15803d,
      4px  4px 0 #166534,
      5px  5px 0 #14532d,
      6px  6px 0 #052e16,
      7px  7px 10px rgba(0,0,0,0.5);
  }

  @keyframes numberFloat {
    0%, 100% { transform: translateY(0) rotateX(0deg); }
    50%       { transform: translateY(-10px) rotateX(3deg); }
  }
  @keyframes zeroSpin {
    0%, 100% { transform: rotateY(0deg) scale(1); }
    25%       { transform: rotateY(15deg) scale(1.05); }
    75%       { transform: rotateY(-15deg) scale(1.05); }
  }

  /* ── SVG Panda Stage ── */
  .panda-stage {
    position: relative;
    width: 340px;
    height: 300px;
    margin-top: -30px;
  }

  /* Shadow under panda */
  .panda-shadow {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 24px;
    background: rgba(0,0,0,0.35);
    border-radius: 50%;
    filter: blur(10px);
    animation: shadowPulse 4s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scaleX(1);   opacity: 0.35; }
    50%       { transform: translateX(-50%) scaleX(0.8); opacity: 0.2; }
  }

  /* Body float */
  .panda-body-group {
    animation: pandaFloat 4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes pandaFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%       { transform: translateY(-14px) rotate(-1.5deg); }
    75%       { transform: translateY(-8px) rotate(1deg); }
  }

  /* Ears wiggle */
  .ear-left  { animation: earWiggleL 3s ease-in-out infinite 0.2s; transform-origin: 50% 100%; }
  .ear-right { animation: earWiggleR 3s ease-in-out infinite 0.4s; transform-origin: 50% 100%; }
  @keyframes earWiggleL {
    0%, 100% { transform: rotate(0deg); }
    30%       { transform: rotate(-12deg); }
    60%       { transform: rotate(6deg); }
  }
  @keyframes earWiggleR {
    0%, 100% { transform: rotate(0deg); }
    30%       { transform: rotate(12deg); }
    60%       { transform: rotate(-6deg); }
  }

  /* Eye blink */
  .eye-blink {
    animation: blink 5s ease-in-out infinite;
    transform-origin: center;
  }
  .eye-blink-r {
    animation: blink 5s ease-in-out infinite 0.1s;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95%            { transform: scaleY(0.05); }
  }

  /* Pupil dart */
  .pupil-l { animation: pupilDart 7s ease-in-out infinite; }
  .pupil-r { animation: pupilDart 7s ease-in-out infinite 0.15s; }
  @keyframes pupilDart {
    0%, 100%  { transform: translate(0, 0); }
    20%        { transform: translate(2px, 1px); }
    40%        { transform: translate(-2px, 2px); }
    60%        { transform: translate(1px, -1px); }
    80%        { transform: translate(-1px, 1px); }
  }

  /* Panda body breathe */
  .body-breathe {
    animation: breathe 4s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50%       { transform: scaleY(1.02) scaleX(1.01); }
  }

  /* Arms wave */
  .arm-left  {
    animation: armWaveL 3s ease-in-out infinite;
    transform-origin: 100% 20%;
  }
  .arm-right {
    animation: armWaveR 3s ease-in-out infinite 0.3s;
    transform-origin: 0% 20%;
  }
  @keyframes armWaveL {
    0%, 100% { transform: rotate(0deg); }
    40%       { transform: rotate(-25deg); }
  }
  @keyframes armWaveR {
    0%, 100% { transform: rotate(0deg); }
    40%       { transform: rotate(22deg); }
  }

  /* Bamboo sway */
  .bamboo-sway {
    animation: bamSway 3.5s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes bamSway {
    0%, 100% { transform: rotate(-2deg); }
    50%       { transform: rotate(4deg); }
  }

  /* Tail wag */
  .tail-wag {
    animation: tailWag 1.5s ease-in-out infinite;
    transform-origin: 20% 50%;
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-15deg); }
    50%       { transform: rotate(15deg); }
  }

  /* ── Text content ── */
  .content {
    text-align: center;
    margin-top: 8px;
  }

  .error-label {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(22px, 5vw, 34px);
    color: var(--panda-white);
    letter-spacing: 1px;
    animation: labelPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  .error-sub {
    font-size: clamp(14px, 2vw, 17px);
    color: rgba(255,255,255,0.45);
    margin-top: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    animation: labelPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
    max-width: 340px;
    line-height: 1.6;
  }

  @keyframes labelPop {
    from { opacity: 0; transform: translateY(20px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0)    scale(1);   }
  }

  /* ── Button ── */
  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    padding: 13px 32px;
    border-radius: 50px;
    background: var(--bamboo);
    color: #052e16;
    font-family: 'Fredoka One', cursive;
    font-size: 17px;
    letter-spacing: 0.5px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.5), 0 8px 32px rgba(0,0,0,0.4);
    animation:
      labelPop 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.7s both,
      btnPulse 2.5s ease-in-out 1.5s infinite;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-home:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 0 8px rgba(74,222,128,0.15), 0 12px 40px rgba(0,0,0,0.5);
  }
  .btn-home:active { transform: scale(0.96); }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0   rgba(74,222,128,0.4), 0 8px 32px rgba(0,0,0,0.4); }
    50%       { box-shadow: 0 0 0 12px rgba(74,222,128,0),   0 8px 32px rgba(0,0,0,0.4); }
  }

  /* Bamboo stalks (decorative) */
  .bamboo-deco {
    position: fixed;
    bottom: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
  }
  .bamboo-deco.left  { left: -20px; animation: bamDecoSway 6s ease-in-out infinite; transform-origin: 50% 100%; }
  .bamboo-deco.right { right: -20px; animation: bamDecoSway 6s ease-in-out infinite 1s reverse; transform-origin: 50% 100%; }
  @keyframes bamDecoSway {
    0%, 100% { transform: rotate(-3deg); }
    50%       { transform: rotate(5deg); }
  }

  /* Stars */
  .star {
    position: fixed;
    border-radius: 50%;
    background: white;
    pointer-events: none;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50%       { opacity: 0.8; transform: scale(1.4); }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="mist"></div>

<!-- Decorative bamboo stalks -->
<svg class="bamboo-deco left" width="80" height="420" viewBox="0 0 80 420" fill="none">
  <rect x="28" y="0"  width="18" height="420" rx="9" fill="#4ade80"/>
  <rect x="28" y="60"  width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="28" y="120" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="28" y="180" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="28" y="240" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="28" y="300" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="28" y="360" width="18" height="6" rx="3" fill="#16a34a"/>
  <!-- side branch -->
  <rect x="5"  y="100" width="23" height="10" rx="5" fill="#22c55e"/>
  <rect x="46" y="200" width="23" height="10" rx="5" fill="#22c55e"/>
  <rect x="5"  y="310" width="23" height="10" rx="5" fill="#22c55e"/>
</svg>
<svg class="bamboo-deco right" width="80" height="420" viewBox="0 0 80 420" fill="none">
  <rect x="34" y="0"  width="18" height="420" rx="9" fill="#4ade80"/>
  <rect x="34" y="70"  width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="34" y="140" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="34" y="210" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="34" y="280" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="34" y="350" width="18" height="6" rx="3" fill="#16a34a"/>
  <rect x="11" y="110" width="23" height="10" rx="5" fill="#22c55e"/>
  <rect x="57" y="220" width="23" height="10" rx="5" fill="#22c55e"/>
  <rect x="11" y="330" width="23" height="10" rx="5" fill="#22c55e"/>
</svg>

<div class="scene">

  <!-- 3D error number -->
  <div class="error-number">
    4<span class="zero">0</span>4
  </div>

  <!-- Panda SVG -->
  <div class="panda-stage">
    <div class="panda-shadow"></div>

    <svg width="340" height="280" viewBox="0 0 340 280" fill="none" xmlns="http://www.w3.org/2000/svg">

      <g class="panda-body-group">

        <!-- Tail -->
        <g class="tail-wag">
          <ellipse cx="222" cy="210" rx="16" ry="12" fill="#e2e8f0"/>
        </g>

        <!-- Arms -->
        <g class="arm-left">
          <ellipse cx="112" cy="190" rx="22" ry="13" fill="#1a1a2e" transform="rotate(-20 112 190)"/>
          <ellipse cx="105" cy="202" rx="14" ry="10" fill="#1a1a2e" transform="rotate(-20 105 202)"/>
        </g>
        <g class="arm-right">
          <ellipse cx="228" cy="190" rx="22" ry="13" fill="#1a1a2e" transform="rotate(20 228 190)"/>
          <ellipse cx="235" cy="202" rx="14" ry="10" fill="#1a1a2e" transform="rotate(20 235 202)"/>
        </g>

        <!-- Body -->
        <g class="body-breathe">
          <ellipse cx="170" cy="210" rx="72" ry="62" fill="#f0f4f8"/>
          <!-- belly spot -->
          <ellipse cx="170" cy="218" rx="38" ry="32" fill="#e2e8f0"/>
        </g>

        <!-- Legs / feet -->
        <ellipse cx="142" cy="258" rx="22" ry="14" fill="#1a1a2e"/>
        <ellipse cx="198" cy="258" rx="22" ry="14" fill="#1a1a2e"/>
        <!-- toe lines -->
        <line x1="133" y1="264" x2="133" y2="270" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
        <line x1="142" y1="266" x2="142" y2="272" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
        <line x1="151" y1="264" x2="151" y2="270" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
        <line x1="189" y1="264" x2="189" y2="270" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
        <line x1="198" y1="266" x2="198" y2="272" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
        <line x1="207" y1="264" x2="207" y2="270" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>

        <!-- Neck -->
        <ellipse cx="170" cy="162" rx="36" ry="20" fill="#f0f4f8"/>

        <!-- Head -->
        <ellipse cx="170" cy="130" rx="62" ry="58" fill="#f0f4f8"/>

        <!-- Ears -->
        <g class="ear-left">
          <ellipse cx="120" cy="84" rx="24" ry="22" fill="#1a1a2e"/>
          <ellipse cx="120" cy="87" rx="14" ry="13" fill="#2d2d44"/>
        </g>
        <g class="ear-right">
          <ellipse cx="220" cy="84" rx="24" ry="22" fill="#1a1a2e"/>
          <ellipse cx="220" cy="87" rx="14" ry="13" fill="#2d2d44"/>
        </g>

        <!-- Eye patches -->
        <ellipse cx="147" cy="124" rx="22" ry="20" fill="#1a1a2e"/>
        <ellipse cx="193" cy="124" rx="22" ry="20" fill="#1a1a2e"/>

        <!-- Eyes white -->
        <g class="eye-blink">
          <ellipse cx="147" cy="124" rx="14" ry="13" fill="white"/>
        </g>
        <g class="eye-blink-r">
          <ellipse cx="193" cy="124" rx="14" ry="13" fill="white"/>
        </g>

        <!-- Pupils -->
        <g class="pupil-l">
          <circle cx="149" cy="126" r="7" fill="#1a1a2e"/>
          <circle cx="152" cy="123" r="2.5" fill="white"/>
        </g>
        <g class="pupil-r">
          <circle cx="195" cy="126" r="7" fill="#1a1a2e"/>
          <circle cx="198" cy="123" r="2.5" fill="white"/>
        </g>

        <!-- Nose -->
        <ellipse cx="170" cy="144" rx="10" ry="7" fill="#1a1a2e"/>
        <ellipse cx="168" cy="143" rx="3" ry="2" fill="#2d2d44"/>

        <!-- Blush -->
        <ellipse cx="134" cy="143" rx="11" ry="7" fill="rgba(251,146,60,0.35)"/>
        <ellipse cx="206" cy="143" rx="11" ry="7" fill="rgba(251,146,60,0.35)"/>

        <!-- Mouth - sad curve -->
        <path d="M 158 155 Q 170 148 182 155" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>

        <!-- Sweat drop (worried) -->
        <g style="animation: sweatDrop 4s ease-in-out infinite 1s;">
          <path d="M 224 108 Q 227 115 224 118 Q 221 115 224 108 Z" fill="#60a5fa" opacity="0.8"/>
        </g>

        <!-- Bamboo in hand (right arm area) -->
        <g class="bamboo-sway" style="transform-origin: 235px 195px;">
          <rect x="230" y="155" width="10" height="90" rx="5" fill="#4ade80"/>
          <rect x="230" y="175" width="10" height="5" rx="2" fill="#16a34a"/>
          <rect x="230" y="210" width="10" height="5" rx="2" fill="#16a34a"/>
          <!-- leaf -->
          <ellipse cx="248" cy="165" rx="18" ry="9" fill="#22c55e" transform="rotate(-30 248 165)"/>
          <ellipse cx="214" cy="200" rx="14" ry="7" fill="#22c55e" transform="rotate(20 214 200)"/>
        </g>

        <!-- Question marks floating above head -->
        <g style="animation: qFloat 3s ease-in-out infinite;">
          <text x="100" y="72" font-family="Fredoka One, cursive" font-size="22" fill="#fb923c" opacity="0.85">?</text>
        </g>
        <g style="animation: qFloat 3s ease-in-out infinite 0.7s;">
          <text x="224" y="65" font-family="Fredoka One, cursive" font-size="18" fill="#f472b6" opacity="0.75">?</text>
        </g>
        <g style="animation: qFloat 3s ease-in-out infinite 1.4s;">
          <text x="162" y="54" font-family="Fredoka One, cursive" font-size="14" fill="#60a5fa" opacity="0.6">?</text>
        </g>

      </g><!-- /panda-body-group -->
    </svg>
  </div>

  <!-- Text -->
  <div class="content">
    <div class="error-label">Oops! The panda got lost 🐼</div>
    <div class="error-sub">This page wandered off into the bamboo forest.<br>Even the panda can't find it.</div>
    <a class="btn-home" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7"/><path d="M9 21V12h6v9"/></svg>
      Take me home
    </a>
  </div>

</div>

<script>
// Floating particles
(function() {
  const colors = ['#4ade80','#f472b6','#60a5fa','#fb923c','#a78bfa'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 5 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*10+8}s;
      animation-delay:${Math.random()*8}s;
    `;
    document.body.appendChild(p);
  }

  // Stars
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*85}vh;
      left:${Math.random()*100}vw;
      animation-duration:${Math.random()*3+2}s;
      animation-delay:${Math.random()*4}s;
    `;
    document.body.appendChild(s);
  }
})();
</script>

<style>
  @keyframes qFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.85; }
    50%       { transform: translateY(-10px) rotate(5deg); opacity: 0.4; }
  }
  @keyframes sweatDrop {
    0%, 80%, 100% { opacity: 0; transform: translateY(-4px); }
    50%            { opacity: 0.9; transform: translateY(4px); }
  }
</style>

</body>
</html>
