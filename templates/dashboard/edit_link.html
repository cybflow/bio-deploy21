{% extends "base.html" %}

{% block title %}Edit Link{% endblock %}

{% block content %}

<div class="container" style="padding-block: clamp(28px, 5vw, 48px);">
  <div class="glass fade" style="max-width: 520px; margin-inline: auto;">

    <h1 style="font-size: clamp(18px, 3vw, 24px); font-weight: 700; margin-bottom: 20px;">Edit Link</h1>

    <form method="POST">
      {% csrf_token %}

      <label for="{{ form.title.id_for_label }}">Title</label>
      {{ form.title }}

      <label for="{{ form.url.id_for_label }}">URL</label>
      {{ form.url }}

      <label for="{{ form.icon.id_for_label }}">Icon</label>
      {{ form.icon }}

      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a class="btn btn-ghost" href="/dashboard/">Cancel</a>
      </div>

    </form>

  </div>
</div>

{% endblock %}
